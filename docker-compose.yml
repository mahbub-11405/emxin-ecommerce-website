services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-EMXIN Technologies}
    container_name: emxin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-4310}:4310"
    environment:
      NODE_ENV: production
      PORT: 4310
      HOSTNAME: 0.0.0.0
      # server-side rendering calls the API inside Docker instead of over the internet
      API_INTERNAL_URL: http://backend:8430/api/v1
      PAGE_CACHE_SECONDS: ${PAGE_CACHE_SECONDS:-30}
    depends_on:
      backend:
        condition: service_healthy
    networks: [emxin]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-EMXIN Technologies}
        NEXT_PUBLIC_STORE_URL: ${FRONTEND_URL}
    container_name: emxin-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-4320}:4320"
    environment:
      NODE_ENV: production
      PORT: 4320
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks: [emxin]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emxin-api
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8430}:8430"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8430/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [emxin]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  emxin:
    name: emxin-network
    driver: bridge
